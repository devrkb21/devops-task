name: CI

# Runs on every pull request into dev or pub, and is reused by the release workflow so
# dev is checked by exactly the same gates before anything is built and pushed.
on:
  pull_request:
    branches: [dev, pub]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  TERRAFORM_VERSION: "1.17.1"
  # Trivy runs as a pinned container image instead of through aquasecurity/trivy-action:
  # in March 2026 almost all trivy-action tags were repointed to malicious commits and
  # Trivy 0.69.4-0.69.6 were compromised. 0.69.3 is a version Aqua confirmed safe.
  TRIVY_IMAGE: aquasec/trivy:0.69.3
  PROMETHEUS_IMAGE: prom/prometheus:v3.16.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0

jobs:
  test:
    name: Lint, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests with coverage
        run: python -m pytest

      - name: Coverage summary
        if: always()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  static-checks:
    name: Dockerfile, shell, Kubernetes and Prometheus checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Lint shell scripts (shellcheck)
        run: |
          shellcheck --version
          shellcheck scripts/*.sh scripts/ci/*.sh scripts/k8s/*.sh terraform/app/templates/deploy-app.sh

      - name: Validate Kubernetes manifests (kubeconform)
        run: |
          cp k8s/overlays/local/secret.env.example k8s/overlays/local/secret.env
          kubectl kustomize k8s/overlays/local \
            | docker run --rm -i "$KUBECONFORM_IMAGE" -strict -summary -

      - name: Validate Prometheus alert rules (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/prometheus-config:ro" \
            "$PROMETHEUS_IMAGE" check rules /prometheus-config/rules/alerts.yml

      - name: Validate dashboard JSON
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            jq -e '.uid and .title and (.panels | length > 0)' "$f" > /dev/null
            echo "ok: $f"
          done

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate
        run: |
          for dir in terraform/bootstrap terraform/app; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  image:
    name: Build, smoke test and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: devops-task:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          build-args: |
            APP_VERSION=0.0.0-ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL "$IMAGE"
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | jq -e '.status == "running"'
          curl -fsS http://127.0.0.1:8080/metrics | grep -q '^http_requests_total'
          test "$(docker exec smoke id -u)" = "10001"  # must not run as root
          docker rm -f smoke

      - name: Report image size
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Vulnerability report (HIGH and CRITICAL, informational)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --no-progress --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"

      - name: Vulnerability gate (fail on CRITICAL)
        # --ignore-unfixed: a CRITICAL with no released fix cannot be patched by us, so it
        # would block every release without a remedy. Accepted risks go in .trivyignore.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image --no-progress --severity CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 "$IMAGE"
