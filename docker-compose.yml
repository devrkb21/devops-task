name: devops-task

# Usage
#   App only:            docker compose up -d --build
#   App + monitoring:    docker compose --profile monitoring up -d --build
#                        (or set COMPOSE_PROFILES=monitoring in .env, as .env.example does)
#
# Networks
#   frontend   - normal bridge network; only the app (8080) and Grafana (3000) publish ports.
#   monitoring - internal network (no route to the internet, nothing published to the host).
#                Prometheus, Loki, Alloy, Node Exporter and cAdvisor live only here.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-monitoring: &monitoring
  profiles: ["monitoring"]
  restart: unless-stopped
  logging: *default-logging
  networks:
    - monitoring

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0-local}
    image: devops-task:${APP_VERSION:-1.0.0-local}
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8080"
      # Optional: enables /debug/error and /debug/slow for demoing alerts and dashboards.
      DEBUG_TOKEN: ${DEBUG_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging: *default-logging
    networks:
      - frontend
      - monitoring

  prometheus:
    <<: *monitoring
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Keep 15 days of metrics, but never more than 2 GB on disk.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  loki:
    <<: *monitoring
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  alloy:
    <<: *monitoring
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Reading the Docker socket requires root (or the host's docker group). Note that a
    # read-only (:ro) mount only stops the socket file being replaced; it does not limit
    # the Docker API. See README "Privileged components" for the trade-off.
    user: "0:0"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  node-exporter:
    <<: *monitoring
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    # Host PID namespace so process-level stats reflect the host, not this container.
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cadvisor:
    <<: *monitoring
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      # Only the metric groups the dashboards use; fewer series, less CPU.
      - --enable_metrics=cpu,memory,network,diskIO
      # Don't turn every container label into a Prometheus label (cardinality); keep
      # only the compose service name.
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    # cAdvisor reads cgroup and kernel data for every container. The upstream docs require
    # privileged mode on cgroup v2 / RHEL-family hosts. See README "Privileged components".
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M

  grafana:
    <<: *monitoring
    image: grafana/grafana:13.3.0
    ports:
      - "3000:3000"
    # Refuse to start with Grafana's default admin/admin login. The check lives here rather
    # than in ${VAR:?} interpolation so `docker compose up` for the app alone still works
    # without a Grafana password.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
        echo "GRAFANA_ADMIN_PASSWORD is not set. Copy .env.example to .env and set it." >&2;
        exit 1; fi; exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/application.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.50"
          # Measured after loading the three dashboards: 220 MiB with the old 256M limit
          # (85%, near the 90% ContainerMemoryNearLimit alert); about 270 MiB (70%) with 384M.
          memory: 384M
    networks:
      - frontend
      - monitoring

networks:
  frontend:
  monitoring:
    internal: true

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
