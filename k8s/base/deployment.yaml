apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # Zero-downtime rolling update: start one extra pod, wait until it is Ready, and only
  # then remove an old one. Capacity never drops below the desired replica count.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-task
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-task
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # The app never calls the Kubernetes API, so it gets no service-account token.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: devops-task # tag is set by kustomize (images:)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DEBUG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DEBUG_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          # Startup probe gives the process time to boot; liveness and readiness
          # only take over once it has passed.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          # Not ready -> removed from the Service endpoints, so it gets no traffic.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # Stuck process -> restarted. Less aggressive than readiness on purpose.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Endpoint removal and SIGTERM happen in parallel. Pausing first lets the
            # ingress and kube-proxy stop routing here before the app starts draining.
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
