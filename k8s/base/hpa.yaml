apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-task
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-task
  minReplicas: 2
  maxReplicas: 5
  metrics:
    # Utilization is measured against the CPU *request* (100m): 70% = 70m per pod.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale up quickly, scale down slowly to avoid flapping.
    scaleDown:
      stabilizationWindowSeconds: 120
