# k3d ships the Traefik ingress controller. *.localhost resolves to 127.0.0.1 on most
# systems, so no /etc/hosts change is needed. Alternative without an ingress:
#   kubectl -n devops-task port-forward svc/devops-task 8081:80
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-task
spec:
  ingressClassName: traefik
  rules:
    - host: devops-task.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-task
                port:
                  name: http
