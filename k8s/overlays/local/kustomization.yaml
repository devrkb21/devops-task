apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local k3d cluster. Production on EKS would be another overlay (see README).
# The namespace must be set here too, so the generated Secret lands next to the
# Deployment and kustomize can rewrite the reference to its hashed name.
namespace: devops-task

resources:
  - ../../base

images:
  - name: devops-task
    newName: devops-task
    newTag: 1.0.0

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - APP_ENV=local-k8s

# The Secret is generated from secret.env, which is git-ignored, so no secret value
# is ever committed. Create it first:  cp secret.env.example secret.env
# The generated name gets a content hash suffix, so changing a value rolls the pods.
secretGenerator:
  - name: app-secrets
    envs:
      - secret.env
